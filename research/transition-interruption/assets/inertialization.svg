<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img" aria-labelledby="title desc"><title id="title">새 경로와 잔차의 합</title><desc id="desc">기존 화면의 pose와 velocity를 새 효과의 초기 출력과 비교해 잔차를 만든다. 새 효과 경로는 직접 출력에 더하고, 초기 잔차만 spring으로 감쇠한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#687583"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect x="26" y="28" width="235" height="90" fill="#eef4fc" stroke="#3265a8"/><text x="143.5" y="67" font-size="16" fill="#214f8a" text-anchor="middle">이전의 최종 화면</text><text x="143.5" y="91" font-size="16" fill="#214f8a" text-anchor="middle">y_old, v_old</text><path d="M261,73 L325,73" fill="none" stroke="#687583" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="325" y="28" width="300" height="90" fill="#f7f8fa" stroke="#bdc4cd"/><text x="475" y="55" font-size="16" fill="#20252b" text-anchor="middle">초기 차이 계산</text><text x="475" y="79" font-size="16" fill="#20252b" text-anchor="middle">r₀ = y_old − d(0)</text><text x="475" y="103" font-size="16" fill="#20252b" text-anchor="middle">ṙ₀ = v_old − ḋ(0)</text><rect x="26" y="186" width="235" height="80" fill="#f7f8fa" stroke="#bdc4cd"/><text x="143.5" y="220" font-size="16" fill="#20252b" text-anchor="middle">새 효과의 경로</text><text x="143.5" y="244" font-size="16" fill="#20252b" text-anchor="middle">d(τ), ḋ(τ)</text><rect x="325" y="186" width="300" height="80" fill="#eef4fc" stroke="#3265a8"/><text x="475" y="220" font-size="16" fill="#214f8a" text-anchor="middle">잔차의 spring 감쇠</text><text x="475" y="244" font-size="16" fill="#214f8a" text-anchor="middle">r(τ), ṙ(τ)</text><path d="M625,226 L674,226" fill="none" stroke="#687583" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="674" y="176" width="160" height="100" fill="#eef4fc" stroke="#3265a8"/><text x="754" y="220" font-size="16" fill="#214f8a" text-anchor="middle">최종 출력</text><text x="754" y="244" font-size="16" fill="#214f8a" text-anchor="middle">d(τ) + r(τ)</text><path d="M261,215 L292,215 L292,102 L325,102" fill="none" stroke="#687583" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M144,266 L144,310 L754,310 L754,276" fill="none" stroke="#687583" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M475,118 L475,186" fill="none" stroke="#687583" stroke-width="1.5" marker-end="url(#arrow)"/><text x="410" y="302" font-size="14" fill="#4c5867" text-anchor="middle">새 경로 d(τ)는 출력에 직접 합산</text><text x="26" y="359" font-size="17" fill="#214f8a" text-anchor="start">접합 순간: 위치와 속도는 이전 화면과 같다.</text><text x="26" y="389" font-size="17" fill="#20252b" text-anchor="start">이후: 잔차가 줄어들며 새 효과의 연출로 수렴한다.</text><text x="26" y="418" font-size="15" fill="#20252b" text-anchor="start">다시 interrupt되면 d + r의 최종 출력에서 새 잔차 하나를 만든다.</text></g></svg>
