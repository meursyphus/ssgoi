<svg xmlns="http://www.w3.org/2000/svg" width="860" height="315" viewBox="0 0 860 315" role="img" aria-labelledby="title desc"><title id="title">역전환 좌표와 화면 속도</title><desc id="desc">p 0.4에서 현재 B 위치는 240px이며 속도는 -800px/s다. q 0.6과 q 속도 -2로 재매개화하면 두 값 모두 보존된다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#687583"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect x="25" y="45" width="240" height="88" fill="#f7f8fa" stroke="#bdc4cd"/><text x="145" y="83" font-size="16" fill="#20252b" text-anchor="middle">기존 진입 · p = 0.4</text><text x="145" y="107" font-size="16" fill="#20252b" text-anchor="middle">x = 400(1 − p)</text><path d="M265,89 L325,89" fill="none" stroke="#687583" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="325" y="45" width="220" height="88" fill="#eef4fc" stroke="#3265a8"/><text x="435" y="83" font-size="16" fill="#214f8a" text-anchor="middle">현재 B</text><text x="435" y="107" font-size="16" fill="#214f8a" text-anchor="middle">240px, −800px/s</text><path d="M545,89 L610,89" fill="none" stroke="#687583" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="610" y="45" width="225" height="88" fill="#f7f8fa" stroke="#bdc4cd"/><text x="722.5" y="83" font-size="16" fill="#20252b" text-anchor="middle">새 퇴장 · q = 0.6</text><text x="722.5" y="107" font-size="16" fill="#20252b" text-anchor="middle">x = 400q</text><text x="25" y="27" font-size="18" fill="#20252b" text-anchor="start">같은 물체, 다른 매개화</text><text x="430" y="169" font-size="18" fill="#214f8a" text-anchor="middle">q = 1 − p     /     q̇ = −ṗ</text><line x1="60" y1="229" x2="798" y2="229" stroke="#b9c0c8"/><circle cx="502" cy="229" r="12" fill="#3265a8"/><path d="M482,229 L372,229" fill="none" stroke="#687583" stroke-width="1.5" marker-end="url(#arrow)"/><text x="502" y="205" font-size="15" fill="#214f8a" text-anchor="middle">B · 화면 속도는 여전히 왼쪽</text><text x="60" y="257" font-size="14" fill="#20252b" text-anchor="start">A 쪽</text><text x="798" y="257" font-size="14" fill="#20252b" text-anchor="end">B 쪽</text><text x="25" y="296" font-size="15" fill="#20252b" text-anchor="start">좌표를 바꾸면 scalar 속도의 부호가 바뀔 수 있다. 화면 속도를 뒤집는 것과 다르다.</text></g></svg>
