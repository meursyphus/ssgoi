<svg xmlns="http://www.w3.org/2000/svg" width="860" height="435" viewBox="0 0 860 435" role="img" aria-labelledby="title desc"><title id="title">인계 트랜잭션</title><desc id="desc">새 intent와 generation을 만들고 비동기 prepare, 최신 pose 재샘플, ID 매칭을 거쳐 새 writer 준비 후 소유권을 교체하고 이전 writer를 해제한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#687583"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect x="26" y="32" width="240" height="65" fill="#f7f8fa" stroke="#bdc4cd"/><text x="146" y="70.5" font-size="16" fill="#20252b" text-anchor="middle">새 intent / generation</text><path d="M266,64 L309,64" fill="none" stroke="#687583" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="309" y="32" width="245" height="65" fill="#f7f8fa" stroke="#bdc4cd"/><text x="431.5" y="70.5" font-size="16" fill="#20252b" text-anchor="middle">비동기 prepare / layout</text><path d="M554,64 L600,64" fill="none" stroke="#687583" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="600" y="32" width="234" height="65" fill="#eef4fc" stroke="#3265a8"/><text x="717" y="70.5" font-size="16" fill="#214f8a" text-anchor="middle">최신 pose 재샘플</text><path d="M717,97 L717,156" fill="none" stroke="#687583" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="600" y="156" width="234" height="65" fill="#eef4fc" stroke="#3265a8"/><text x="717" y="194.5" font-size="16" fill="#214f8a" text-anchor="middle">ID별 인계 계획</text><path d="M600,188 L554,188" fill="none" stroke="#687583" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="309" y="156" width="245" height="65" fill="#f7f8fa" stroke="#bdc4cd"/><text x="431.5" y="194.5" font-size="16" fill="#20252b" text-anchor="middle">새 writer 첫 출력 준비</text><path d="M309,188 L266,188" fill="none" stroke="#687583" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="26" y="156" width="240" height="65" fill="#eef4fc" stroke="#3265a8"/><text x="146" y="194.5" font-size="16" fill="#214f8a" text-anchor="middle">ownership 교체</text><path d="M146,221 L146,280" fill="none" stroke="#687583" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="26" y="280" width="240" height="65" fill="#f7f8fa" stroke="#bdc4cd"/><text x="146" y="318.5" font-size="16" fill="#20252b" text-anchor="middle">old writer detach</text><path d="M266,312 L309,312" fill="none" stroke="#687583" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="309" y="280" width="245" height="65" fill="#f7f8fa" stroke="#bdc4cd"/><text x="431.5" y="318.5" font-size="16" fill="#20252b" text-anchor="middle">source-only retire</text><path d="M554,312 L600,312" fill="none" stroke="#687583" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="600" y="280" width="234" height="65" fill="#f7f8fa" stroke="#bdc4cd"/><text x="717" y="318.5" font-size="16" fill="#20252b" text-anchor="middle">lease = 0 → dispose</text><text x="26" y="388" font-size="17" fill="#214f8a" text-anchor="start">기존 화면은 인계 준비가 끝날 때까지 보존한다.</text><text x="26" y="417" font-size="14" fill="#20252b" text-anchor="start">각 비동기 경계에서 generation 확인. 이전 endpoint를 쓰는 complete는 인계 수단으로 쓰지 않는다.</text></g></svg>
