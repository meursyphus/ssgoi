<svg xmlns="http://www.w3.org/2000/svg" width="860" height="365" viewBox="0 0 860 365" role="img" aria-labelledby="title desc"><title id="title">A B C의 surface 생애</title><desc id="desc">A에서 B로 갈 때 A는 퇴장하고 B는 입장한다. C 입력 후 A는 retire를 마치며 B는 입장에서 퇴장으로, C는 새 입장으로 이어진다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#687583"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="150" y="28" font-size="15" fill="#20252b" text-anchor="start">A → B 시작</text><text x="424" y="28" font-size="15" fill="#214f8a" text-anchor="start">C 입력</text><text x="705" y="28" font-size="15" fill="#20252b" text-anchor="start">C 정착</text><line x1="443" y1="44" x2="443" y2="292" stroke="#3265a8" stroke-dasharray="5 5"/><text x="28" y="104" font-size="20" fill="#20252b" text-anchor="start">A</text><rect x="150" y="70" width="293" height="50" fill="#f7f8fa" stroke="#bdc4cd"/><text x="296.5" y="101" font-size="16" fill="#20252b" text-anchor="middle">exiting</text><rect x="443" y="70" width="152" height="50" fill="#f7f8fa" stroke="#bdc4cd"/><text x="519" y="101" font-size="16" fill="#20252b" text-anchor="middle">retiring</text><text x="617" y="101" font-size="15" fill="#20252b" text-anchor="start">해제</text><text x="28" y="184" font-size="20" fill="#20252b" text-anchor="start">B</text><rect x="150" y="150" width="293" height="50" fill="#eef4fc" stroke="#3265a8"/><text x="296.5" y="181" font-size="16" fill="#214f8a" text-anchor="middle">entering</text><rect x="443" y="150" width="292" height="50" fill="#eef4fc" stroke="#3265a8"/><text x="589" y="181" font-size="16" fill="#214f8a" text-anchor="middle">현재 pose에서 exiting</text><text x="28" y="264" font-size="20" fill="#20252b" text-anchor="start">C</text><rect x="443" y="230" width="292" height="50" fill="#eef4fc" stroke="#3265a8"/><text x="589" y="261" font-size="16" fill="#214f8a" text-anchor="middle">entering</text><path d="M150,306 L799,306" fill="none" stroke="#687583" stroke-width="1.5" marker-end="url(#arrow)"/><text x="799" y="332" font-size="14" fill="#4c5867" text-anchor="end">시각적 시간 →</text><text x="28" y="355" font-size="15" fill="#20252b" text-anchor="start">C 입력 시점에 B를 완성된 중간 화면으로 만들지 않는다. A도 즉시 제거할 필요는 없다.</text></g></svg>
