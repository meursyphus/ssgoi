<svg xmlns="http://www.w3.org/2000/svg" width="860" height="370" viewBox="0 0 860 370" role="img" aria-labelledby="title desc"><title id="title">최신 탐색과 계속 살아 있는 운동</title><desc id="desc">최신 탐색 A에서 B, 이어 C는 새 목표를 만들고 MotionScene은 대상별 현재 운동 상태를 유지한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#687583"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial, Apple SD Gothic Neo, Noto Sans KR, sans-serif"><text x="26" y="30" font-size="16" fill="#20252b" text-anchor="start">탐색 의도</text><rect x="26" y="50" width="220" height="58" fill="#f7f8fa" stroke="#bdc4cd"/><text x="136" y="85" font-size="16" fill="#20252b" text-anchor="middle">A → B → C</text><path d="M246,79 L340,79" fill="none" stroke="#687583" stroke-width="1.5" marker-end="url(#arrow)"/><text x="293" y="70" font-size="13" fill="#4c5867" text-anchor="middle">새 목표</text><rect x="340" y="50" width="220" height="58" fill="#f7f8fa" stroke="#bdc4cd"/><text x="450" y="85" font-size="16" fill="#20252b" text-anchor="middle">효과 / 목적지 계획</text><path d="M450,108 L450,150" fill="none" stroke="#687583" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="26" y="150" width="808" height="185" fill="#eef4fc" stroke="#3265a8"/><text x="48" y="181" font-size="19" fill="#214f8a" text-anchor="start">MotionScene · ID별 상태와 소유권</text><rect x="48" y="205" width="168" height="90" fill="#f7f8fa" stroke="#bdc4cd"/><text x="132" y="244" font-size="16" fill="#20252b" text-anchor="middle">A surface</text><text x="132" y="268" font-size="16" fill="#20252b" text-anchor="middle">퇴장 상태 유지</text><rect x="244" y="205" width="168" height="90" fill="#f7f8fa" stroke="#bdc4cd"/><text x="328" y="244" font-size="16" fill="#20252b" text-anchor="middle">B surface</text><text x="328" y="268" font-size="16" fill="#20252b" text-anchor="middle">입장 → 퇴장</text><rect x="440" y="205" width="168" height="90" fill="#f7f8fa" stroke="#bdc4cd"/><text x="524" y="244" font-size="16" fill="#20252b" text-anchor="middle">C surface</text><text x="524" y="268" font-size="16" fill="#20252b" text-anchor="middle">최신 목적지</text><rect x="636" y="205" width="174" height="90" fill="#f7f8fa" stroke="#bdc4cd"/><text x="723" y="244" font-size="16" fill="#20252b" text-anchor="middle">photo:42</text><text x="723" y="268" font-size="16" fill="#20252b" text-anchor="middle">연속 flight</text><text x="26" y="359" font-size="15" fill="#20252b" text-anchor="start">탐색은 최신 의도를 따른다. 화면의 모든 대상이 동시에 끝날 필요는 없다.</text></g></svg>
