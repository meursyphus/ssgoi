"260" height="55" fill="#f7f8fa" stroke="#bdc4cd"/><text x="704" y="314.5" font-size="16" fill="#20252b" text-anchor="middle">drill / dim</text><path d="M266,156 C390,156 438,232 574,232" fill="none" stroke="#3265a8" stroke-width="2" marker-end="url(#arrow)"/><path d="M266,232 C390,232 438,156 574,156" fill="none" stroke="#3265a8" stroke-width="2" marker-end="url(#arrow)"/><text x="420" y="117" font-size="15" fill="#214f8a" text-anchor="middle">key + role + schema</text><text x="299" y="84" font-size="14" fill="#20252b" text-anchor="start">retire</text><text x="534" y="84" font-size="14" fill="#20252b" text-anchor="end">enter</text><text x="299" y="314" font-size="14" fill="#20252b" text-anchor="start">retire</text><text x="534" y="314" font-size="14" fill="#20252b" text-anchor="end">enter</text><rect x="26" y="368" width="808" height="67" fill="#f7f8fa" stroke="#bdc4cd"/><text x="430" y="395.5" font-size="16" fill="#20252b" text-anchor="middle">배열 순서와 child 수가 달라도, 같은 ID의 대상은 운동을 이어받는다.</text><text x="430" y="419.5" font-size="16" fill="#20252b" text-anchor="middle">ID 매칭 다음에는 채널 · 좌표 · solver 호환성을 검사한다.</text></g></svg>
