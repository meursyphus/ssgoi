<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="yzTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#ffb24a"/>
    </linearGradient>
    <radialGradient id="yzPeel" cx="40%" cy="35%" r="60%">
      <stop offset="0" stop-color="#ff9457"/>
      <stop offset="0.7" stop-color="#ff7a45"/>
      <stop offset="1" stop-color="#e85d28"/>
    </radialGradient>
    <radialGradient id="yzGloss" cx="36%" cy="30%" r="32%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#yzTile)"/>
  <!-- confetti dots -->
  <g>
    <circle cx="11" cy="14" r="1.4" fill="#1a1a2e"/>
    <circle cx="55" cy="10" r="1.6" fill="#8ed1a4"/>
    <circle cx="52" cy="52" r="1.4" fill="#1a1a2e"/>
    <circle cx="9" cy="50" r="1.6" fill="#ff7a45"/>
    <path d="M50 18 l3 -1.5 l-1 3 z" fill="#1a1a2e"/>
    <path d="M14 40 l-3 1 l2 2.5 z" fill="#1a1a2e"/>
  </g>
  <!-- citrus body -->
  <circle cx="32" cy="34" r="18" fill="url(#yzPeel)" stroke="#1a1a2e" stroke-width="2"/>
  <!-- leaf -->
  <path d="M32 15 Q26 8 18 11 Q22 17 31 18 Z" fill="#8ed1a4" stroke="#1a1a2e" stroke-width="1.6" stroke-linejoin="round"/>
  <line x1="31.4" y1="17.4" x2="25" y2="12.4" stroke="#1a1a2e" stroke-width="0.8"/>
  <!-- stem -->
  <line x1="31.6" y1="18.2" x2="31.6" y2="16" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round"/>
  <!-- highlight -->
  <ellipse cx="24" cy="27" rx="6" ry="3.6" fill="url(#yzGloss)"/>
  <!-- happy face -->
  <g stroke="#1a1a2e" stroke-width="1.8" stroke-linecap="round" fill="none">
    <path d="M25 33 q0 -2 2 -2" />
    <path d="M37 33 q0 -2 2 -2" />
    <path d="M25 40 q3 4 7 4 q4 0 7 -4" />
  </g>
  <!-- blush -->
  <circle cx="22.5" cy="40" r="1.8" fill="#ff7a45" fill-opacity="0.7"/>
  <circle cx="41.5" cy="40" r="1.8" fill="#ff7a45" fill-opacity="0.7"/>
</svg>
