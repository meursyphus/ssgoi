<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="hdTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd54a"/>
      <stop offset="0.55" stop-color="#f7a917"/>
      <stop offset="1" stop-color="#d97a06"/>
    </linearGradient>
    <linearGradient id="hdDrop" x1="0.4" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#fff4c2"/>
      <stop offset="0.45" stop-color="#fbcd4e"/>
      <stop offset="1" stop-color="#a85a07"/>
    </linearGradient>
    <radialGradient id="hdGloss" cx="38%" cy="32%" r="40%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#hdTile)"/>
  <!-- subtle honeycomb pattern in background -->
  <g fill="#ffffff" fill-opacity="0.10">
    <polygon points="52,4 58,7.5 58,14.5 52,18 46,14.5 46,7.5"/>
    <polygon points="60,16 66,19.5 66,26.5 60,30 54,26.5 54,19.5"/>
    <polygon points="44,16 50,19.5 50,26.5 44,30 38,26.5 38,19.5"/>
    <polygon points="6,46 12,49.5 12,56.5 6,60 0,56.5 0,49.5"/>
    <polygon points="14,58 20,61.5 20,68.5 14,72 8,68.5 8,61.5"/>
  </g>
  <!-- subtle inner shadow under droplet -->
  <ellipse cx="32" cy="55" rx="14" ry="2.6" fill="#5a2a00" fill-opacity="0.25"/>
  <!-- droplet -->
  <path d="M32 11
           C 32 11, 17 28, 18 39
           C 18 47, 24 53, 32 53
           C 40 53, 46 47, 46 39
           C 47 28, 32 11, 32 11 Z"
        fill="url(#hdDrop)"
        stroke="#6a3500" stroke-opacity="0.45" stroke-width="1.4"/>
  <!-- specular highlight -->
  <path d="M26 28
           C 22 34, 22 42, 25 47"
        fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2.6" stroke-linecap="round"/>
  <ellipse cx="27" cy="32" rx="2.3" ry="3.6" fill="url(#hdGloss)"/>
</svg>
