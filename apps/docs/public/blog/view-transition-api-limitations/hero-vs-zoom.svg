  </g>
  <path d="M833 335 C879 288 925 261 986 244" fill="none" stroke="#9be6ff" stroke-width="5" stroke-linecap="round"/>
  <path d="M968 237 L990 243 L976 261" fill="none" stroke="#9be6ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="946" y="208" width="166" height="278" rx="18" fill="#20202a" stroke="#69d8ff" stroke-width="3"/>
  <rect x="964" y="228" width="130" height="90" rx="12" fill="#69d8ff"/>
  <rect x="964" y="342" width="130" height="12" rx="6" fill="#4b4b59"/>
